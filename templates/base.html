<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="icon" href="{{favicon}}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{favicon}}">
<link rel="stylesheet" href="/style.css">
<link rel="alternate" type="application/rss+xml" title="{{site_title}}" href="/feed.xml">
<meta name="theme-color" content="#fdfcf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16151a" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{site_url}}">
<meta property="og:site_name" content="{{site_title}}">
<meta name="twitter:card" content="summary">
<script>
/* 在首屏绘制前定好主题，否则会白闪一下。
   放在 head 里同步执行，不能 defer。 */
(function(){try{var t=localStorage.getItem('theme');
if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
</script>
{{extra_head}}
</head>
<body>
<a class="skip" href="#main">跳到正文</a>

<header class="site-head">
  <div class="wrap head-inner">
    <a class="brand" href="/">
      <span class="brand-cat" aria-hidden="true">{{cat_svg}}</span>
      <span class="brand-text">
        <span class="brand-cn">{{site_title}}</span>
        <span class="brand-en">{{site_title_en}}</span>
      </span>
    </a>
    <nav class="nav">
      {{nav}}
    </nav>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="切换明暗主题" title="切换明暗主题">
      <span class="theme-sun" aria-hidden="true"></span>
      <span class="theme-moon" aria-hidden="true"></span>
    </button>
  </div>
</header>

<main class="wrap" id="main">
{{body}}
</main>

<footer class="site-foot">
  <div class="wrap foot-inner">
    <span class="foot-brand">{{site_title}} · {{site_title_en}}</span>
    <span class="foot-links">
      <a href="/feed.xml">RSS</a>
      <span class="dot">·</span>
      <a href="/sitemap.xml">Sitemap</a>
    </span>
    <span class="foot-copy">© {{year}}</span>
  </div>
</footer>

<script src="/app.js" defer></script>
</body>
</html>
